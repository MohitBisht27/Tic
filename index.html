<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Tic-Tac-Toe</h1>
        <p class="tagline">Classic Game of Strategy</p>
      </header>

      <div class="game-wrapper">
        <div class="mode-selection" id="modeSelection">
          <h2>Select Game Mode</h2>
          <button class="mode-btn" onclick="startGame('pvp')">
            <span class="mode-icon">👥</span>
            <span>2 Players</span>
          </button>
          <button class="mode-btn" onclick="startGame('pvc')">
            <span class="mode-icon">🤖</span>
            <span>Play vs CPU</span>
          </button>
        </div>

        <div class="game-container" id="gameContainer" style="display: none">
          <div class="game-info">
            <div class="player-info">
              <span id="currentPlayer"></span>
              <span id="gameStatus"></span>
            </div>
            <div class="score-board">
              <div class="score-item">
                <span class="score-label">X Wins:</span>
                <span class="score-value" id="scoreX">0</span>
              </div>
              <div class="score-item">
                <span class="score-label">Draws:</span>
                <span class="score-value" id="scoreDraw">0</span>
              </div>
              <div class="score-item">
                <span class="score-label">O Wins:</span>
                <span class="score-value" id="scoreO">0</span>
              </div>
            </div>
          </div>

          <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
          </div>

          <div class="button-group">
            <button class="btn btn-reset" onclick="resetGame()">
              New Game
            </button>
            <button class="btn btn-back" onclick="backToMenu()">
              Back to Menu
            </button>
          </div>
        </div>

        <div class="result-modal" id="resultModal" style="display: none">
          <div class="modal-content">
            <h2 id="resultTitle"></h2>
            <p id="resultMessage"></p>
            <button class="btn btn-primary" onclick="resetGame()">
              Play Again
            </button>
            <button class="btn btn-secondary" onclick="backToMenu()">
              Main Menu
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
